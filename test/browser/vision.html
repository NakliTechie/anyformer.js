<!doctype html><meta charset="utf-8"><title>vision</title>
<!-- An image in a chat message: ?repo= a multimodal repo (default Qwen3.5 4B ONNX), ?budget= GB (default 8),
     ?backend=<id> (default transformers). On diskformer (MiniCPM-V 4.7) the image goes as packed RGB bytes after
     ensureVision(); ?local=1 reads the GGUF, the vision encoder and cats.jpg from run.mjs's --models folders.
     Two cats on a sofa (transformers.js's docs image); PASS when the reply names cats. -->
<script type="module">
import * as af from '../../index.js';
import { run, log, reply } from './harness.js';
const q = new URLSearchParams(location.search);
// With ?local=1 the image comes from --models too, so the check needs no network.
const IMAGE = q.get('local') ? `${location.origin}/models/cats.jpg` : 'https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/cats.jpg';
const backend = Object.values(af).find((b) => b?.id === (q.get('backend') || 'transformers') && b.canRun);
if (q.get('local')) {
  af.diskformerBackend.url = (model, m) => `${location.origin}/models/${m.file}`;
  // The engine fetches the vision encoder from a fixed Hugging Face URL; serve the local copy instead.
  const fetch0 = fetch;
  window.fetch = (u, o) => fetch0(typeof u === 'string' && /\/resolve\/[^/]+\/mmproj-/.test(u) ? `${location.origin}/models/${u.split('/').pop()}` : u, o);
}
run('vision', async () => {
  const s = await af.load(q.get('repo') || 'onnx-community/Qwen3.5-4B-ONNX-OPT', { backends: [backend], budget: Number(q.get('budget') || 8) * 1e9 });
  log(`loaded by ${s.backend}`);
  const bmp = await createImageBitmap(await (await fetch(IMAGE)).blob());
  const ctx = new OffscreenCanvas(bmp.width, bmp.height).getContext('2d');
  ctx.drawImage(bmp, 0, 0);
  let image = ctx.getImageData(0, 0, bmp.width, bmp.height), part = { type: 'image', image };
  if (s.ensureVision) {
    await s.ensureVision({ onProgress: (p) => log(`vision ${JSON.stringify(p)}`) });
    const rgb = new Uint8Array(image.width * image.height * 3);
    for (let i = 0, j = 0; i < image.data.length; i += 4) { rgb[j++] = image.data[i]; rgb[j++] = image.data[i + 1]; rgb[j++] = image.data[i + 2]; }
    part = { type: 'image', rgb, width: image.width, height: image.height };
  }
  const r = await reply(s, [{ role: 'user', content: [part, { type: 'text', text: 'What animals are in this picture, and how many?' }] }], 40);
  await s.dispose();
  return { ok: /\bcats?\b/i.test(r.text), backend: s.backend, repo: s.plan.model.repo, ...r };
});
</script>
