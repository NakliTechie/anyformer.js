<!doctype html><meta charset="utf-8"><title>localmind</title>
<!-- A LocalMind engine through anyformer: ?repo=<Hub id> (default LFM2.5 230M GGUF), ?budget=<GB>. -->
<script type="module">
import { load, localmindBackend } from '../../index.js';
import { run, log, reply, onTopic } from './harness.js';
const q = new URLSearchParams(location.search);
run('localmind', async () => {
  const t0 = performance.now();
  let last = '';
  const s = await load(q.get('repo') || 'LiquidAI/LFM2.5-230M-GGUF', {
    backends: [localmindBackend], budget: Number(q.get('budget') || 2.5) * 1e9,
    onProgress: (p) => { const t = `${p.engine} ${p.status || p.phase || ''} ${p.file || ''} ${p.loaded ?? ''}/${p.total ?? ''}`; if (t !== last && Date.now() % 3 === 0) log(last = t); },
  });
  const loadSeconds = +((performance.now() - t0) / 1e3).toFixed(1);
  log(`loaded by ${s.backend} in ${loadSeconds} s`);
  const r = await reply(s, [{ role: 'user', content: 'Explain what a CPU does in two sentences.' }], 64);
  await s.dispose();
  return { ok: onTopic(r.text), backend: s.backend, repo: s.plan.model.repo, loadSeconds, ...r };
});
</script>
