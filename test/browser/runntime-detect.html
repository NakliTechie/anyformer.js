<!doctype html><meta charset="utf-8"><title>runntime-detect</title>
<script type="module">
import { load, runntimeBackend } from '../../index.js';
import { run, log } from './harness.js';
// Two cats on a sofa (the image transformers.js's docs use; Xenova/transformers.js-docs).
const IMAGE = 'https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/cats.jpg';
run('runntime-detect', async () => {
  const s = await load('onnx-community/yolo26n-ONNX', { backends: [runntimeBackend] });
  log(`loaded by ${s.backend} for ${s.task}`);
  const bmp = await createImageBitmap(await (await fetch(IMAGE)).blob());
  const ctx = new OffscreenCanvas(bmp.width, bmp.height).getContext('2d');
  ctx.drawImage(bmp, 0, 0);
  const found = await s.run(ctx.getImageData(0, 0, bmp.width, bmp.height));
  await s.dispose();
  const cats = found.filter((o) => o.label === 'cat' && o.confidence > 0.5);
  return { ok: cats.length >= 2, backend: s.backend, task: s.task, cats: cats.length, top: found.slice(0, 5).map((o) => `${o.label} ${o.confidence.toFixed(2)}`) };
});
</script>
