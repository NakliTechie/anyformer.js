<!doctype html><meta charset="utf-8"><title>kohra-cache</title>
<!-- kohra v0.3.1+ through anyformer: the first load reports download bytes through onProgress and leaves the graph
     files in Cache Storage 'kohra-models'; stored() lists them under kohra; a second load reads them back (in under a
     quarter of the first load's time; Resource Timing cannot see the fetches, since Hugging Face's CDN sends no
     Timing-Allow-Origin) and gives the same reply; remove() deletes them. ?repo=<Hub id> (default Nemotron-Labs-Diffusion-3B). -->
<script type="module">
import { load, stored, remove, kohraBackend } from '../../index.js';
import { run, log, onTopic } from './harness.js';
const repo = new URLSearchParams(location.search).get('repo') || 'naklitechie/Nemotron-Labs-Diffusion-3B-ONNX';
const msgs = [{ role: 'user', content: 'Explain what a CPU does in two sentences.' }];
const once = async () => {
  const t0 = performance.now(), events = [];
  let at = 0;
  const s = await load(repo, { backends: [kohraBackend], onProgress: (e) => {
    events.push(e);
    if (e.status === 'progress' && Date.now() - at > 10000) { at = Date.now(); log(`${e.file} ${(e.loaded / 1e9).toFixed(2)} of ${(e.total / 1e9).toFixed(2)} GB`); }
  } });
  const loadSeconds = +((performance.now() - t0) / 1e3).toFixed(1);
  let text = '';
  for await (const c of s.generate(msgs, { maxNewTokens: 32 })) text = c.text;
  s.dispose();
  const progress = events.filter((e) => e.status === 'progress');
  return { loadSeconds, text, progressEvents: progress.length, maxLoaded: Math.max(0, ...progress.map((e) => e.loaded)) };
};
run('kohra-cache', async () => {
  const first = await once();
  log(`first: ${JSON.stringify({ ...first, text: undefined })}`);
  const row = (await stored()).find((r) => r.backend === 'kohra' && r.repo === repo);
  log(`stored: ${JSON.stringify(row)}`);
  const second = await once();
  log(`second: ${JSON.stringify({ ...second, text: undefined })}`);
  const gone = await remove(repo);
  const left = (await stored()).some((r) => r.backend === 'kohra' && r.repo === repo);
  return {
    ok: onTopic(first.text) && first.progressEvents > 0 && first.maxLoaded > 1e9 && row?.bytes > 2e9
      && second.text === first.text && second.loadSeconds < first.loadSeconds / 4 && !left,
    repo, first, second, storedBytes: row?.bytes, freed: gone?.bytes, removed: !left,
  };
});
</script>
