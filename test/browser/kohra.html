<!doctype html><meta charset="utf-8"><title>kohra</title>
<script type="module">
import { load, kohraBackend } from '../../index.js';
import { run, log, reply, onTopic } from './harness.js';
run('kohra', async () => {
  const t0 = performance.now();
  let last = '';
  // ?repo= runs another model through the same check.
  const s = await load(new URLSearchParams(location.search).get('repo') || 'naklitechie/Qwen3-0.6B-diffusion-mdlm-ONNX', {
    backends: [kohraBackend],
    onProgress: (p) => { const t = `${p.status} ${p.file || ''} ${p.progress ? p.progress.toFixed(0) + '%' : ''}`; if (t !== last) log(last = t); },
  });
  const loadSeconds = +((performance.now() - t0) / 1e3).toFixed(1);
  log(`loaded by ${s.backend} in ${loadSeconds} s`);
  const r = await reply(s, [{ role: 'user', content: 'Explain what a CPU does in two sentences.' }], 32);
  s.dispose();
  return { ok: onTopic(r.text), backend: s.backend, loadSeconds, ...r };
});
</script>
