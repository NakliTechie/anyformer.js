<!doctype html><meta charset="utf-8"><title>stored</title>
<!-- Lists the store; ?remove=<repo> also removes that repo and lists again. Run against a kept profile to see its
     models, e.g. node test/browser/run.mjs stored --port 8193 --profile ~/.cache/anyformer-localmind-profile -->
<script type="module">
import { stored, remove } from '../../index.js';
import { run } from './harness.js';
const q = new URLSearchParams(location.search);
run('stored', async () => {
  const rows = await stored();
  if (!q.get('remove')) return { ok: true, rows };
  const freed = await remove(q.get('remove'));
  const after = await stored();
  return { ok: !after.some((r) => r.repo === q.get('remove')), rows, freed, after };
});
</script>
